<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>נערות ליווי ❤️</title>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #fff4f7;
            color: #222;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: linear-gradient(
                135deg,
                #ff1744,
                #ff4081
            );

            color: white;

            padding: 20px 6%;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {
            font-size: 27px;
            font-weight: bold;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;

            padding: 45px 20px 30px;
        }


        .hero h1 {
            color: #e91e63;

            font-size: 40px;

            margin-bottom: 10px;
        }


        .hero p {
            color: #777;

            font-size: 17px;
        }


        /* =========================
           PROFILES
        ========================= */

        .container {
            width: 94%;

            max-width: 1000px;

            margin: auto;

            padding-bottom: 100px;
        }


        .profiles {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 15px;
        }


        .profile {
            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.09);

            transition: 0.2s;
        }


        .profile:hover {
            transform: translateY(-3px);
        }


        .profile-image {
            width: 100%;

            height: 300px;

            object-fit: cover;

            display: block;
        }


        .no-image {
            width: 100%;

            height: 300px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            background:
                linear-gradient(
                    135deg,
                    #ffe0e8,
                    #fff1f5
                );

            color: #e91e63;

            font-size: 60px;
        }


        .no-image span {
            font-size: 14px;

            color: #888;

            margin-top: 8px;
        }


        .profile-content {
            padding: 15px;
        }


        .name {
            font-size: 22px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .age {
            color: #e91e63;

            font-weight: normal;
        }


        .location {
            color: #777;

            font-size: 14px;

            margin-bottom: 12px;
        }


        .phone {
            background: #f8f8f8;

            border-radius: 8px;

            padding: 10px;

            direction: ltr;

            text-align: center;

            margin-bottom: 10px;

            font-weight: bold;
        }


        .buttons {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 7px;
        }


        .btn {
            border: none;

            border-radius: 8px;

            padding: 10px 5px;

            cursor: pointer;

            text-decoration: none;

            text-align: center;

            font-size: 13px;
        }


        .copy-btn {
            background: #eeeeee;

            color: #333;
        }


        .whatsapp-btn {
            background: #25D366;

            color: white;

            font-weight: bold;
        }


        /* =========================
           FLOATING PLUS
        ========================= */

        .add-profile {
            position: fixed;

            left: 25px;

            bottom: 25px;

            width: 65px;

            height: 65px;

            border-radius: 50%;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #ff1744,
                    #e91e63
                );

            color: white;

            font-size: 36px;

            line-height: 65px;

            text-align: center;

            cursor: pointer;

            box-shadow:
                0 7px 25px rgba(233,30,99,0.4);

            z-index: 100;
        }


        .add-profile:hover {
            transform: scale(1.08);
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.55);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 15px;

            z-index: 200;
        }


        .modal.active {
            display: flex;
        }


        .modal-box {
            background: white;

            width: 100%;

            max-width: 500px;

            max-height: 92vh;

            overflow-y: auto;

            border-radius: 20px;

            padding: 25px;

            position: relative;
        }


        .modal-title {
            font-size: 25px;

            color: #e91e63;

            margin-bottom: 20px;
        }


        .close {
            position: absolute;

            left: 15px;

            top: 12px;

            border: none;

            background: #eee;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            font-size: 20px;

            cursor: pointer;
        }


        .form-group {
            margin-bottom: 15px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }


        .form-group input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 16px;
        }


        .form-group input:focus {
            outline: none;

            border-color: #e91e63;
        }


        .photo-note {
            background: #fff5f7;

            border: 1px solid #ffd0dc;

            padding: 10px;

            border-radius: 8px;

            color: #777;

            font-size: 13px;

            margin-top: 8px;
        }


        .upload-error {
            display: none;

            background: #fff0f0;

            color: #c62828;

            padding: 10px;

            border-radius: 8px;

            margin-top: 10px;

            font-size: 14px;
        }


        .upload-error.show {
            display: block;
        }


        .submit-btn {
            width: 100%;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #ff1744,
                    #e91e63
                );

            color: white;

            padding: 14px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }


        .submit-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        .loading {
            display: none;

            text-align: center;

            color: #e91e63;

            margin-top: 10px;
        }


        /* =========================
           MOBILE
           עדיין 2 פרופילים בשורה
        ========================= */

        @media (max-width: 600px) {

            .profiles {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 9px;
            }


            .profile {
                border-radius: 13px;
            }


            .profile-image,
            .no-image {
                height: 190px;
            }


            .profile-content {
                padding: 10px;
            }


            .name {
                font-size: 17px;
            }


            .location {
                font-size: 11px;
            }


            .phone {
                font-size: 12px;

                padding: 8px;
            }


            .btn {
                font-size: 11px;

                padding: 9px 2px;
            }


            .hero h1 {
                font-size: 29px;
            }


            .hero p {
                font-size: 14px;
            }


            .add-profile {
                width: 70px;

                height: 70px;

               

                font-size: 13px;

                left: 18px;

                bottom: 18px;
            }
        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        ❤️ נערות ליווי
    </div>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        מעגר בחורות עצמיות  ❤️
    </h1>

    <p>
        
    </p>

</section>


<!-- =========================
     PROFILES
========================= -->

<main class="container">

    <div
        id="profiles"
        class="profiles"
    >

        <!-- הפרופילים ייטענו מ-Supabase -->

    </div>

</main>


<!-- =========================
     FLOATING PLUS
========================= -->

<button
    class="add-profile"
    id="openModal"
    title="הוספת פרופיל"
>
  להצטרפות
    
</button>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="profileModal"
>

    <div class="modal-box">

        <button
            class="close"
            id="closeModal"
        >
            ×
          
        </button>


        <h2 class="modal-title">
            הוספת פרופיל ❤️
        </h2>


        <form id="profileForm">


            <!-- גיל -->

            <div class="form-group">

                <label for="age">
                    גיל
                </label>

                <input
                    id="age"
                    type="number"
                    min="18"
                    max="120"
                    placeholder="לדוגמה: 25"
                    required
                >

            </div>


            <!-- שם בדוי -->

            <div class="form-group">

                <label for="nickname">
                    שם בדוי
                </label>

                <input
                    id="nickname"
                    type="text"
                    maxlength="40"
                    placeholder="לדוגמה: מאיה"
                    required
                >

            </div>


            <!-- מיקום -->

            <div class="form-group">

                <label for="location">
                    מיקום
                </label>

                <input
                    id="location"
                    type="text"
                    maxlength="100"
                    placeholder="לדוגמה: תל אביב"
                    required
                >

            </div>


            <!-- טלפון -->

            <div class="form-group">

                <label for="phone">
                    מספר טלפון
                </label>

                <input
                    id="phone"
                    type="tel"
                    maxlength="30"
                    placeholder="לדוגמה: 0501234567"
                    required
                >

            </div>


            <!-- תמונה -->

            <div class="form-group">

                <label for="photo">
                    תמונת פרופיל
                    <span style="color:#999;">
                        (לא חובה)
                    </span>
                </label>

                <input
                    id="photo"
                    type="file"
                    accept="image/jpeg,image/png,image/webp"
                >


                <div class="photo-note">

                    אפשר להמשיך גם ללא תמונה.
                    גודל מקסימלי: 5MB.

                </div>


                <div
                    id="uploadError"
                    class="upload-error"
                >
                    אין אפשרות להעלות תמונה כרגע.
                    ניתן להמשיך ללא תמונה.

                </div>

            </div>


            <!-- הסכמה -->

            <div
                style="
                    background:#fff8fa;
                    padding:12px;
                    border-radius:9px;
                    margin-bottom:12px;
                    font-size:13px;
                    color:#555;
                "
            >

                <label
                    style="
                        display:flex;
                        gap:8px;
                        align-items:flex-start;
                    "
                >

                    <input
                        type="checkbox"
                        id="consent"
                        required
                    >

                    <span>
                        אני מאשרת שהפרטים שהזנתי,
                        כולל מספר הטלפון, יוצגו
                        בפרופיל באתר.
                    </span>

                </label>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                פרסום פרופיל ❤️
            </button>


            <div
                id="loading"
                class="loading"
            >
                שומר את הפרופיל...
            </div>


        </form>

    </div>

</div>


<script>

/* ==================================================
   SUPABASE CONFIG
================================================== */

const SUPABASE_URL =
    "https://dnzvisligajrimrqnufp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xWNmtq1TIWt9fY0ZCaN8kw_KFy12pmQ";


/* יצירת Supabase client */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   ELEMENTS
================================================== */

const profilesContainer =
    document.getElementById("profiles");

const modal =
    document.getElementById("profileModal");

const openModal =
    document.getElementById("openModal");

const closeModal =
    document.getElementById("closeModal");

const profileForm =
    document.getElementById("profileForm");

const photoInput =
    document.getElementById("photo");

const uploadError =
    document.getElementById("uploadError");

const submitBtn =
    document.getElementById("submitBtn");

const loading =
    document.getElementById("loading");


/* ==================================================
   OPEN / CLOSE MODAL
================================================== */

openModal.addEventListener(
    "click",
    () => {

        modal.classList.add("active");

    }
);


closeModal.addEventListener(
    "click",
    () => {

        modal.classList.remove("active");

    }
);


/* סגירה בלחיצה על הרקע */

modal.addEventListener(
    "click",
    (event) => {

        if (
            event.target === modal
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* ==================================================
   ESC CLOSE
================================================== */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Escape"
        ) {

            modal.classList.remove(
                "active"
            );

        }

    }
);


/* ==================================================
   FORMAT PHONE FOR WHATSAPP
================================================== */

function phoneForWhatsApp(phone) {

    let clean =
        phone.replace(
            /[^\d+]/g,
            ""
        );


    /*
       אם המספר מתחיל ב-0,
       מניחים שמדובר בישראל.
    */

    if (
        clean.startsWith("0")
    ) {

        clean =
            "972" +
            clean.substring(1);

    }


    clean =
        clean.replace(
            "+",
            ""
        );


    return clean;
}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


/* ==================================================
   LOAD PROFILES
================================================== */

async function loadProfiles() {

    profilesContainer.innerHTML = `
        <div style="
            grid-column:1/-1;
            text-align:center;
            padding:30px;
            color:#999;
        ">
            טוען פרופילים...
        </div>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        profilesContainer.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:30px;
                color:#c62828;
            ">
                לא ניתן לטעון את הפרופילים.
            </div>
        `;

        return;
    }


    profilesContainer.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        profilesContainer.innerHTML = `
            <div style="
                grid-column:1/-1;
                text-align:center;
                padding:50px;
                color:#999;
            ">
                עדיין אין פרופילים.
                <br><br>
                לחצי על + כדי להוסיף פרופיל.
            </div>
        `;

        return;
    }


    data.forEach(
        profile => {

            createProfileCard(
                profile
            );

        }
    );

}


/* ==================================================
   CREATE PROFILE CARD
================================================== */

function createProfileCard(profile) {

    const card =
        document.createElement("div");

    card.className =
        "profile";


    const safeName =
        escapeHTML(
            profile.nickname
        );

    const safeLocation =
        escapeHTML(
            profile.location
        );

    const safePhone =
        escapeHTML(
            profile.phone
        );


    const whatsappNumber =
        phoneForWhatsApp(
            profile.phone
        );


    let imageHTML = "";


    if (
        profile.avatar_url
    ) {

        imageHTML = `
            <img
                class="profile-image"
                src="${escapeHTML(profile.avatar_url)}"
                alt="${safeName}"
                loading="lazy"
            >
        `;

    } else {

        imageHTML = `
            <div class="no-image">

                👤

                <span>
                    ללא תמונה
                </span>

            </div>
        `;

    }


    card.innerHTML = `

        ${imageHTML}

        <div class="profile-content">

            <div class="name">

                ${safeName}

                <span class="age">
                    ${profile.age}
                </span>

            </div>


            <div class="location">

                📍 ${safeLocation}

            </div>


            <div class="phone">

                📞 ${safePhone}

            </div>


            <div class="buttons">

                <button
                    class="btn copy-btn"
                    data-phone="${safePhone}"
                >
                    📋 העתק
                </button>


                <a
                    class="btn whatsapp-btn"
                    href="https://wa.me/${whatsappNumber}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    💬 WhatsApp
                </a>

            </div>

        </div>
    `;


    const copyButton =
        card.querySelector(
            ".copy-btn"
        );


    copyButton.addEventListener(
        "click",
        async () => {

            try {

                await navigator.clipboard.writeText(
                    profile.phone
                );


                copyButton.textContent =
                    "✓ הועתק";


                setTimeout(
                    () => {

                        copyButton.textContent =
                            "📋 העתק";

                    },
                    1500
                );


            } catch (error) {

                alert(
                    "לא ניתן להעתיק את המספר."
                );

            }

        }
    );


    profilesContainer.appendChild(
        card
    );

}


/* ==================================================
   UPLOAD IMAGE
================================================== */

async function uploadProfileImage(
    file
) {

    if (!file) {

        return null;

    }


    /*
       בדיקה מקומית לפני העלאה
    */

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        throw new Error(
            "סוג הקובץ אינו נתמך."
        );

    }


    /*
       5MB
    */

    if (
        file.size > 5 * 1024 * 1024
    ) {

        throw new Error(
            "התמונה גדולה מדי."
        );

    }


    /*
       שם ייחודי
    */

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const fileName =
        crypto.randomUUID() +
        "." +
        extension;


    const filePath =
        "profiles/" +
        fileName;


    const {
        data,
        error
    } = await supabaseClient
        .storage
        .from("profile-images")
        .upload(
            filePath,
            file,
            {
                cacheControl: "3600",
                upsert: false,
                contentType: file.type
            }
        );


    if (error) {

        console.error(
            "Image upload error:",
            error
        );

        throw error;

    }


    /*
       מכיוון שה-bucket ציבורי,
       אפשר לקבל URL ציבורי.
    */

    const {
        data: publicUrlData
    } =
        supabaseClient
            .storage
            .from("profile-images")
            .getPublicUrl(
                data.path
            );


    return publicUrlData.publicUrl;
}


/* ==================================================
   FORM SUBMIT
================================================== */

profileForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        submitBtn.disabled =
            true;

        loading.style.display =
            "block";

        uploadError.classList.remove(
            "show"
        );


        try {

            const age =
                Number(
                    document.getElementById(
                        "age"
                    ).value
                );


            const nickname =
                document.getElementById(
                    "nickname"
                ).value.trim();


            const location =
                document.getElementById(
                    "location"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            const photo =
                photoInput.files[0];


            /*
               בדיקות
            */

            if (
                age < 18 ||
                age > 120
            ) {

                throw new Error(
                    "הגיל חייב להיות 18 ומעלה."
                );

            }


            if (
                nickname.length < 2
            ) {

                throw new Error(
                    "יש להזין שם בדוי."
                );

            }


            if (
                location.length < 2
            ) {

                throw new Error(
                    "יש להזין מיקום."
                );

            }


            if (
                phone.length < 7
            ) {

                throw new Error(
                    "יש להזין מספר טלפון תקין."
                );

            }


            /*
               העלאת תמונה
            */

            let avatarUrl = null;


            if (photo) {

                try {

                    avatarUrl =
                        await uploadProfileImage(
                            photo
                        );

                } catch (imageError) {

                    /*
                       אם Supabase חוסם
                       את העלאת התמונה,
                       ממשיכים ללא תמונה.
                    */

                    console.warn(
                        "Image unavailable:",
                        imageError
                    );


                    uploadError.classList.add(
                        "show"
                    );


                    avatarUrl =
                        null;

                }

            }


            /*
               שמירת הפרופיל
            */

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("profiles")
                    .insert({
                        age: age,
                        nickname: nickname,
                        location: location,
                        phone: phone,
                        avatar_url: avatarUrl
                    })
                    .select()
                    .single();


            if (error) {

                console.error(
                    error
                );

                throw new Error(
                    "לא ניתן לשמור את הפרופיל."
                );

            }


            /*
               איפוס הטופס
            */

            profileForm.reset();


            /*
               סגירת חלון
            */

            modal.classList.remove(
                "active"
            );


            /*
               טעינה מחדש
            */

            await loadProfiles();


            /*
               הודעה
            */

            if (avatarUrl) {

                alert(
                    "הפרופיל פורסם בהצלחה ❤️"
                );

            } else {

                alert(
                    "הפרופיל פורסם בהצלחה ❤️\n\n" +
                    "הפרופיל נשמר ללא תמונה."
                );

            }


        } catch (error) {

            console.error(
                error
            );


            alert(
                error.message ||
                "אירעה שגיאה."
            );

        } finally {

            submitBtn.disabled =
                false;

            loading.style.display =
                "none";

        }

    }
);


/* ==================================================
   START
================================================== */

loadProfiles();

</script>
